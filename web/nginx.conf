server {
    # 8080, not 80: ports below 1024 need root, and this container runs
    # unprivileged. Cloud Run, App Runner and Fly all expect a high port anyway.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints these filenames, so a changed file is a changed URL and
    # the old one can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the one file that must never be cached: it is what points at
    # the current hashed bundles. Serving a stale one pins users to a dead build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback. The router owns /projects/<id>; without this, refreshing
    # there asks nginx for a file that does not exist and gets a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
