services:
  postgres:
    image: postgres:16
    container_name: dokoboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dokoboard
      POSTGRES_PASSWORD: dokoboard_dev
      POSTGRES_DB: dokoboard
    ports:
      - "5433:5432"
    volumes:
      - dokoboard_pgdata:/var/lib/postgresql/data

volumes:
  dokoboard_pgdata:
